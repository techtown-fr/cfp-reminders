name: CFP reminder

on:
  schedule:
    # 9:07 Paris time, off the hour to dodge GitHub's top-of-hour delays
    - cron: "7 9 * * 1"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message in the logs without posting"
        type: boolean
        default: true
  # Dry-run on every PR: it is a required check, so it must never be skipped
  pull_request:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Post CFP reminder to Google Chat
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then set -- --dry-run; fi
          uv run --frozen --no-dev cfp-reminders --chat "$@"
