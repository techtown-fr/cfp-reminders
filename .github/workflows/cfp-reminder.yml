name: CFP reminder

on:
  schedule:
    # 9:07 Paris time, off the hour to dodge GitHub's top-of-hour delays
    - cron: "7 9 * * 1"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message in the logs without posting"
        type: boolean
        default: true
  # Dry-run on PRs so action bumps and code changes exercise this workflow
  pull_request:
    paths:
      - ".github/workflows/cfp-reminder.yml"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Post CFP reminder to Google Chat
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then set -- --dry-run; fi
          uv run --frozen --no-dev cfp-reminders --chat "$@"
